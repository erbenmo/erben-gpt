[project]
name = "erben"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erben Mo", email = "erbenmo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.14.0",
]

[project.scripts]
erben = "erben:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
