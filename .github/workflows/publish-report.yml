name: Publish scaling report

on:
  push:
    branches: [main]
    paths:
      - reports/scaling-study.html
      - .github/workflows/publish-report.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare report website
        run: |
          mkdir -p _site/reports
          cp reports/scaling-study.html _site/index.html
          cp reports/scaling-study.html _site/reports/scaling-study.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish report
        id: deployment
        uses: actions/deploy-pages@v4
