name: Publish scaling report

on:
  push:
    branches: [main]
    paths:
      - reports/scaling-study.html
      - .github/workflows/publish-report.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare report website
        run: |
          mkdir -p _site/reports
          cp reports/scaling-study.html _site/index.html
          cp reports/scaling-study.html _site/reports/scaling-study.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for report artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "Report artifact did not become visible within one minute."
          exit 1
      - name: Publish report
        id: deployment
        uses: actions/deploy-pages@v4
